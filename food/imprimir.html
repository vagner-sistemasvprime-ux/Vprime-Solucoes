<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Imprimindo...</title>
</head>
<body>
    <div style="text-align: center; margin-top: 50px; font-family: Arial;">
        <h2>🖨️ Enviando para a impressora...</h2>
        <p id="status">Aguarde um instante.</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const numeroPedido = urlParams.get('pedido');

        if (numeroPedido) {
            // URL do servidor local embutido no app Sentinela na porta 8080
            const urlServidorLocal = "http://127.0.0.1:8080/imprimir?pedido=" + encodeURIComponent(numeroPedido);

            // Dispara a requisição em segundo plano sem tirar o foco do navegador/PDV
            fetch(urlServidorLocal, { mode: 'no-cors' })
                .then(() => {
                    document.getElementById('status').innerText = "✅ Pedido enviado com sucesso!";
                })
                .catch(err => {
                    console.log("Erro no disparo:", err);
                    document.getElementById('status').innerText = "⚠️ Comando enviado.";
                });

            // Fecha a aba automaticamente após 1.5 segundo para retornar ao PDV fluidamente
            setTimeout(function() {
                window.close();
            }, 1500);
        }
    </script>
</body>
</html>
