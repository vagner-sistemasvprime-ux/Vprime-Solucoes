<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Imprimindo Pedido...</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; background-color: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; }
        #status-texto { font-weight: bold; color: #333; margin-top: 15px; }
        button { background-color: #28a745; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🖨️ Diagnóstico de Impressão</h2>
        <p>Pedido: <strong id="num-pedido">--</strong></p>
        <p id="status-texto">Iniciando conexão com o app Sentinela...</p>
        <button onclick="window.close()">Fechar Aba</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const numeroPedido = urlParams.get('pedido');
        const statusEl = document.getElementById('status-texto');

        console.log("🔍 [IMPRESSÃO] Página aberta. Número do pedido recebido:", numeroPedido);

        if (!numeroPedido) {
            console.error("❌ [IMPRESSÃO] Erro: Nenhum número de pedido foi encontrado na URL!");
            statusEl.innerText = "❌ Erro: Pedido não informado.";
        } else {
            document.getElementById('num-pedido').innerText = "#" + numeroPedido;
            
            // Tenta falar com o servidor local do app Sentinela na porta 8080
            const urlServidorLocal = "http://127.0.0.1:8080/imprimir?pedido=" + encodeURIComponent(numeroPedido);
            console.log("🌐 [IMPRESSÃO] Tentando requisitar URL local:", urlServidorLocal);

            statusEl.innerText = "Enviando para o app Sentinela (8080)...";

            fetch(urlServidorLocal, { 
                method: 'GET',
                mode: 'no-cors' 
            })
            .then(response => {
                console.log("✅ [IMPRESSÃO] Requisição fetch concluída com sucesso (modo no-cors).");
                statusEl.innerText = "✅ Comando enviado com sucesso! O Sentinela deve imprimir.";
                
                // Fecha a aba automaticamente após 2 segundos se deu tudo certo
                setTimeout(() => {
                    console.log("🔒 [IMPRESSÃO] Fechando aba automaticamente.");
                    window.close();
                }, 2000);
            })
            .catch(err => {
                console.error("❌ [IMPRESSÃO] Falha crítica na requisição fetch para a porta 8080:", err);
                statusEl.innerHTML = "❌ Erro de conexão com a porta 8080.<br><small>" + err.message + "</small>";
            });
        }
    </script>
</body>
</html>
