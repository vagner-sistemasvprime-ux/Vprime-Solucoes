<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Imprimindo Pedido...</title>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; padding-top: 50px; background-color: #f4f4f9;">
    <div style="background: white; padding: 30px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <h2>🖨️ Enviando para Impressora...</h2>
        <p id="status-texto">Processando o pedido <strong id="num-pedido"></strong></p>
        <button onclick="window.close()" style="background-color: #28a745; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 20px;">Fechar Aba</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const numeroPedido = urlParams.get('pedido');

        if (numeroPedido) {
            document.getElementById('num-pedido').innerText = "#" + numeroPedido;
            const urlServidorLocal = "http://127.0.0.1:8080/imprimir?pedido=" + encodeURIComponent(numeroPedido);

            // Dispara o fetch em segundo plano para o app Sentinela
            fetch(urlServidorLocal, { method: 'GET', mode: 'no-cors' })
                .then(() => {
                    document.getElementById('status-texto').innerText = "✅ Pedido enviado com sucesso!";
                })
                .catch(err => {
                    console.log("Erro no disparo:", err);
                    document.getElementById('status-texto').innerText = "⚠️ Comando enviado.";
                });

            // Fecha a aba automaticamente após 1.2 segundo para retornar ao PDV
            setTimeout(function() {
                window.close();
            }, 1200);
        }
    </script>
</body>
</html>
