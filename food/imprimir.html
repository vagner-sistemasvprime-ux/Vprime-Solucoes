<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Imprimindo Pedido...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 60px;
            background-color: #f4f4f9;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🖨️ Disparando Impressão...</h2>
        <p>Pedido: <strong id="num-pedido"></strong></p>
        <p style="color: #666; font-size: 14px;">O app Sentinela foi acionado.</p>
        <button onclick="window.close()">Fechar Aba</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const numeroPedido = urlParams.get('pedido');

        if (numeroPedido) {
            document.getElementById('num-pedido').innerText = "#" + numeroPedido;

            // Dispara o app Sentinela via Custom Scheme após meio segundo
            setTimeout(function() {
                window.location.href = "vprimesentinela://imprimir?pedido=" + encodeURIComponent(numeroPedido);
            }, 500);
        }

        // Tenta fechar a aba automaticamente após 2.5 segundos para retornar ao PDV
        setTimeout(function() {
            window.close();
        }, 2500);
    </script>

</body>
</html>
