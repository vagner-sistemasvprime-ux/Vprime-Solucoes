<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Imprimindo Pedido...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 60px;
            background-color: #f4f4f9;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🖨️ Disparando Impressão...</h2>
        <p>Pedido: <strong id="num-pedido"></strong></p>
        <p style="color: #666; font-size: 14px;">O app Sentinela foi acionado.</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const numeroPedido = urlParams.get('pedido');

        if (numeroPedido) {
            document.getElementById('num-pedido').innerText = "#" + numeroPedido;

            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

            if (isMobile) {
                // FLUXO DO CELULAR
                setTimeout(function() {
                    window.location.href = "vprimesentinela://imprimir?pedido=" + encodeURIComponent(numeroPedido);
                }, 500);
            } else {
                // FLUXO DO COMPUTADOR (WINDOWS) - Silencioso e direto
                setTimeout(function() {
                    fetch(`http://127.0.0.1:8080/imprimir?pedido=${encodeURIComponent(numeroPedido)}`, {
                        method: 'GET',
                        mode: 'cors'
                    })
                    .then(response => response.json())
                    .then(data => {
                        console.log("Sucesso:", data);
                    })
                    .catch(err => {
                        console.error("Erro de conexão (ignorado):", err);
                    });
                }, 300);
            }
        }

        // Fecha a aba automaticamente após 2 segundos
        setTimeout(function() {
            window.close();
        }, 2000);
    </script>

</body>
</html>
