<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Modelo</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1l8pCAVl1Om3oIJ60pn1r4r9GSuBeZkhQ">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    body { font-family: Arial, sans-serif; }
    #sistemaIframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="sistemaIframe" src="" allow="clipboard-read; clipboard-write" title="Sistema Lojista"></iframe>

  <script>
    (function() {
      // 1. Sua URL do Google Apps Script deste lojista específico
      const urlBase = "https://script.google.com/macros/s/AKfycbyiD33PF8zAGzRl0qmH4lkur7uZD6wmg4IxVXpuzPRCrvEY2jb3WZRZnq-XiDWFLNI3/exec";

      const queryParams = window.location.search;
      const iframeApp = document.getElementById('sistemaIframe');
      iframeApp.src = urlBase + queryParams;

      // 2. FUNÇÃO SENTINELA INTERNA (Roda direto no wrapper, sem conflito de iframe externo)
      function verificarFilaImpressao() {
        fetch(urlBase + "?acao=verificarImpressao")
          .then(response => response.json())
          .then(data => {
            if (data && data.imprimir && data.cupomTexto) {
              console.log("Sentinela: Pedido encontrado, repassando para o sistema...", data.pedido);
              
              // Como o wrapper é dono da mesma origem ou pode conversar com o iframe do GAS 
              // (ou se preferir, podemos disparar a impressão direto aqui se o wrapper carregar o texto):
              if (iframeApp && iframeApp.contentWindow) {
                iframeApp.contentWindow.postMessage({
                  acao: "IMPRIMIR_PEDIDO",
                  dados: data.pedido,
                  cupomTexto: data.cupomTexto,
                  config: data.config
                }, "*");
              }
            }
          })
          .catch(err => {
            console.log("Sentinela aguardando...");
          });
      }

      // Roda a verificação a cada 10 segundos
      setInterval(verificarFilaImpressao, 10000);

      // 3. ALERTA DE SEGURANÇA: Impede que o lojista feche a aba sem querer
      window.addEventListener("beforeunload", function (e) {
        e.preventDefault();
        e.returnValue = "Atenção! Se fechar esta aba, o monitoramento de pedidos automáticos será interrompido.";
        return e.returnValue;
      });
    })();
  </script>
</body>
</html>
