<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema VPrime</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1l8pCAVl1Om3oIJ60pn1r4r9GSuBeZkhQ">

 <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    body { font-family: Arial, sans-serif; }
    #sistemaIframe { width: 100%; height: 100%; border: none; }

    /* ESTILO DO CUPOM NA TELA NORMAL (Oculto) */
    #cupom-html-impressao {
      position: absolute;
      left: -9999px;
      top: 0;
    }

    /* ESTILO EXCLUSIVO NA HORA DA IMPRESSÃO */
    @media print {
      body > *:not(#cupom-html-impressao) {
        display: none !important;
      }
      
      #cupom-html-impressao {
        display: block !important;
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        margin: 0 !important;
        padding: 1mm 1.5mm !important;
        
        font-family: 'Courier New', Courier, monospace !important;
        font-weight: 700 !important; /* Negrito firme, sem exagerar no peso */
        line-height: 1.2 !important;
        
        color: #000000 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* LARGURAS DINÂMICAS COM TAMANHOS EQUILIBRADOS */
      #cupom-html-impressao.largura-58 {
        width: 58mm !important;
        font-size: 11px !important; /* Tamanho padrão ideal para 58mm */
      }
      #cupom-html-impressao.largura-58 .header-loja { font-size: 13px !important; }
      #cupom-html-impressao.largura-58 .status-box { font-size: 11px !important; padding: 3px !important; }

      #cupom-html-impressao.largura-80 {
        width: 80mm !important;
        font-size: 12px !important; /* Tamanho padrão ideal para 80mm */
      }
      #cupom-html-impressao.largura-80 .header-loja { font-size: 14px !important; }
      #cupom-html-impressao.largura-80 .status-box { font-size: 12px !important; padding: 3px !important; }

      /* FUTURO: Meia Folha A4 */
      #cupom-html-impressao.largura-a4-metade {
        width: 140mm !important;
        font-size: 14px !important;
        font-family: Arial, sans-serif !important;
      }
      #cupom-html-impressao.largura-a4-metade .header-loja { font-size: 18px !important; }

      /* Classes de utilidade */
      .text-center { text-align: center; }
      .bold { font-weight: 700 !important; }
      
      .header-loja {
        text-align: center;
        margin-bottom: 2px;
      }

      .divider { 
        border-top: 1px dashed #000000; 
        margin: 3px 0; 
      }
      
      .divider-strong { 
        border-top: 2px solid #000000; 
        margin: 3px 0; 
      }
      
      .status-box {
        text-align: center;
        border: 1.5px solid #000000;
        margin: 4px 0;
        background-color: #000 !important;
        color: #fff !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .item-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 2px;
      }

      .item-desc { width: 72%; overflow: hidden; }
      .item-val { width: 28%; text-align: right; }

      .totais-row {
        display: flex;
        justify-content: space-between;
        margin-top: 2px;
      }

      @page {
        margin: 0mm;
        size: auto;
      }
    }
  </style>
</head>
<body>
  <!-- Iframe que carrega o seu sistema principal do GAS -->
  <iframe id="sistemaIframe" src="" allow="clipboard-read; clipboard-write" title="Sistema Lojista"></iframe>

  <!-- Div invisível que recebe o layout formatado em HTML para impressão -->
  <div id="cupom-html-impressao"></div>

  <script>
    (function() {
      // COLOQUE AQUI O SEU LINK ATUALIZADO DO GOOGLE APPS SCRIPT (Web App)
      const urlBase = "https://script.google.com/macros/s/AKfycbyiD33PF8zAGzRl0qmH4lkur7uZD6wmg4IxVXpuzPRCrvEY2jb3WZRZnq-XiDWFLNI3/exec";

      const queryParams = window.location.search;
      const iframeApp = document.getElementById('sistemaIframe');
      iframeApp.src = urlBase + queryParams;

      // Função que verifica periodicamente se há novos pedidos na planilha
      function verificarFilaImpressao() {
        const endpoint = urlBase + (urlBase.includes('?') ? '&' : '?') + 'acao=verificarImpressao';
        
        fetch(endpoint, { method: 'GET', mode: 'cors' })
          .then(response => {
            if (!response.ok) throw new Error('Erro na rede: ' + response.status);
            return response.json();
          })
          .then(data => {
            if (data && data.imprimir && data.pedidoObj) {
              console.log("🟢 Sentinela Web: Pedido encontrado!", data.pedidoObj.pedido);
              
              let venda = data.pedidoObj;
              let divTicket = document.getElementById('cupom-html-impressao');
              
              let isPendente = String(venda.statusFinanceiro).toUpperCase().includes("PENDENTE");
              let msgPagto = isPendente ? ">>> PAGAMENTO PENDENTE <<<" : "*** PAGAMENTO JA REALIZADO ***";
              
              let itensHtml = venda.itens.map((i, index) => `
                <div class="item-row">
                  <span>${String(index + 1).padStart(2, '0')}x ${i.nome}</span>
                  <span>R$ ${Number(i.subtotal).toFixed(2)}</span>
                </div>
              `).join('');

              divTicket.innerHTML = `
                <div class="text-center bold">${venda.loja || 'GESTAO DE PEDIDOS'}</div>
                <div class="text-center">${venda.dataHora}</div>
                <div class="divider-strong"></div>
                <div><b>PEDIDO:</b> #${venda.pedido}</div>
                <div><b>CLIENTE:</b> ${venda.cliente}</div>
                ${venda.telefone ? `<div><b>FONE:</b> ${venda.telefone}</div>` : ''}
                <div><b>END:</b> ${venda.endereco || 'RETIRADA'}</div>
                <div class="divider"></div>
                <div class="status-box">${msgPagto}</div>
                <div class="divider"></div>
                <div class="bold text-center">ITENS DO PEDIDO</div>
                <div class="divider"></div>
                ${itensHtml}
                <div class="divider"></div>
                <div style="display: flex; justify-content: space-between;" class="bold">
                  <span>TOTAL:</span>
                  <span>R$ ${Number(venda.total).toFixed(2)}</span>
                </div>
                <div style="display: flex; justify-content: space-between;">
                  <span>PAGTO:</span>
                  <span>${venda.formaPagamento}</span>
                </div>
                ${venda.troco && venda.troco !== "0" && venda.troco !== "" ? `
                <div style="display: flex; justify-content: space-between;">
                  <span>TROCO:</span>
                  <span>R$ ${venda.troco}</span>
                </div>` : ''}
                <div class="divider-strong"></div>
                <div class="text-center bold">OBRIGADO PELA PREFERENCIA!</div>
                <br><br><br>
              `;

              // Dispara a impressão limpa usando o atalho do Chrome (--kiosk-printing)
              setTimeout(() => {
                window.print();
                
                // Limpa o cupom após 1 segundo
                setTimeout(() => {
                  divTicket.innerHTML = "";
                }, 1000);
              }, 300);
            }
          })
          .catch(err => {
            // Silencia erros de rede temporários para não poluir o console
          });
      }

      // Roda a verificação a cada 10 segundos
      setInterval(verificarFilaImpressao, 10000);

      // Aviso ao tentar fechar a aba acidentalmente
      window.addEventListener("beforeunload", function (e) {
        e.preventDefault();
        e.returnValue = "Atenção! Se fechar esta aba, o monitoramento de pedidos automáticos será interrompido.";
        return e.returnValue;
      });
    })();
  </script>
</body>
</html>
