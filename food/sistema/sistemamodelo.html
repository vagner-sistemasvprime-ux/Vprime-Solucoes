<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Modelo</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1l8pCAVl1Om3oIJ60pn1r4r9GSuBeZkhQ">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    body { font-family: Arial, sans-serif; }
    #sistemaIframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="sistemaIframe" src="" allow="clipboard-read; clipboard-write" title="Sistema Lojista"></iframe>

  <script>
    (function() {
      // 1. Sua URL do Google Apps Script deste lojista específico
      const urlBase = "https://script.google.com/macros/s/AKfycbyiD33PF8zAGzRl0qmH4lkur7uZD6wmg4IxVXpuzPRCrvEY2jb3WZRZnq-XiDWFLNI3/exec";

      const queryParams = window.location.search;
      document.getElementById('sistemaIframe').src = urlBase + queryParams;

      // 2. Cria o Iframe Invisível do Sentinela
      // Passamos a URL do Apps Script codificada para o sentinela monitorar
      const iframeSentinela = document.createElement('iframe');
      iframeSentinela.id = 'iframe_sentinela';
      iframeSentinela.style.display = 'none';
      
      const urlGasCodificada = encodeURIComponent(urlBase);
      iframeSentinela.src = `https://seu-dominio.com/sentinela.html?gas=${urlGasCodificada}`;
      document.body.appendChild(iframeSentinela);

      // 3. Ouvinte que repassa o comando de impressão para dentro do sistema
      window.addEventListener("message", (event) => {
        if (event.data && event.data.acao === "IMPRIMIR_PEDIDO") {
          const iframeApp = document.getElementById('sistemaIframe');
          if (iframeApp && iframeApp.contentWindow) {
            iframeApp.contentWindow.postMessage(event.data, "*");
          }
        }
      });

      // 4. ALERTA DE SEGURANÇA: Impede que o lojista feche a aba sem querer
      window.addEventListener("beforeunload", function (e) {
        e.preventDefault();
        e.returnValue = "Atenção! Se fechar esta aba, o monitoramento de pedidos automáticos será interrompido.";
        return e.returnValue;
      });
    })();
  </script>
</body>
</html>
