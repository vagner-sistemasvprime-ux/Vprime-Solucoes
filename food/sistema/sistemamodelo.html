<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Modelo</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1l8pCAVl1Om3oIJ60pn1r4r9GSuBeZkhQ">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      font-family: Arial, sans-serif;
    }

    #sistemaIframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="sistemaIframe" src="" allow="clipboard-read; clipboard-write" title="Sistema Lojista"></iframe>

  <script>
    (function() {
      // 1. Sua URL atualizada do Google Apps Script
      const urlBase = "https://script.google.com/macros/s/AKfycbyiD33PF8zAGzRl0qmH4lkur7uZD6wmg4IxVXpuzPRCrvEY2jb3WZRZnq-XiDWFLNI3/exec";

      // 2. Pega os parâmetros da URL (ex: ?loja=sil)
      const queryParams = window.location.search;

      // 3. Monta a URL final (Base + parâmetros)
      const urlFinal = urlBase + queryParams;

      // 4. Carrega o sistema no Iframe principal
      document.getElementById('sistemaIframe').src = urlFinal;

      // ==========================================================
      // 5. INICIALIZAÇÃO DO SENTINELA DE IMPRESSÃO (NOVO)
      // ==========================================================
      // Criamos um iframe invisível para cuidar apenas da fila de impressão
      const iframeSentinela = document.createElement('iframe');
      iframeSentinela.id = 'iframe_sentinela';
      iframeSentinela.style.display = 'none';
      
      // Passamos a mesma URL base do Apps Script e os parâmetros para o sentinela
      // O sentinela.html vai rodar no seu domínio principal conversando com esse Apps Script
      iframeSentinela.src = `https://seu-dominio.com/sentinela.html${queryParams}`;
      
      document.body.appendChild(iframeSentinela);

      // ==========================================================
      // 6. OUVINTE DE MENSAGENS (RETRANSMISSÃO PARA O SISTEMA)
      // ==========================================================
      // Como o sentinela avisa a janela principal, repassamos o pedido para dentro 
      // do iframe do sistema onde roda a função imprimirComprovanteAdaptado
      window.addEventListener("message", (event) => {
        if (event.data && event.data.acao === "IMPRIMIR_PEDIDO") {
          const iframeApp = document.getElementById('sistemaIframe');
          if (iframeApp && iframeApp.contentWindow) {
            // Envia o pedido para dentro do sistema do lojista executar a impressão
            iframeApp.contentWindow.postMessage(event.data, "*");
          }
        }
      });
    })();
  </script>
</body>
</html>
