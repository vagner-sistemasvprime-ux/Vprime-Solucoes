<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sentinela VPrime</title>
</head>
<body>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const urlGas = urlParams.get('gas');

        function verificarFilaImpressao() {
            if (!urlGas) {
                console.error("🔴 Sentinela: URL do GAS não informada nos parâmetros.");
                return;
            }

            const endpoint = urlGas + (urlGas.includes('?') ? '&' : '?') + 'acao=verificarImpressao';
            console.log("🔍 Sentinela: Consultando GAS...", endpoint);

            fetch(endpoint, { method: 'GET', mode: 'cors' })
            .then(response => {
                if (!response.ok) throw new Error('Erro na rede: ' + response.status);
                return response.json();
            })
            .then(data => {
                console.log("📥 Sentinela recebeu resposta do GAS:", data);
                if (data && data.imprimir) {
                    console.log("🟢 Sentinela: Pedido pendente encontrado! Disparando postMessage...", data.pedidoObj?.pedido);
                    
                    window.parent.postMessage({
                        acao: "IMPRIMIR_PEDIDO",
                        pedidoObj: data.pedidoObj,
                        config: data.config
                    }, "*");
                } else {
                    console.log("ℹ️ Sentinela: Fila limpa, nenhum pedido para imprimir.");
                }
            })
            .catch(err => {
                console.warn("❌ Sentinela: Erro ao consultar fila de impressão", err);
            });
        }

        if (urlGas) {
            setInterval(verificarFilaImpressao, 10000);
            verificarFilaImpressao();
        }
    </script>
</body>
</html>
