<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sentinela VPrime</title>
</head>
<body>
    <script>
        // Pega a URL do GAS passada via parâmetro ?gas=...
        const urlParams = new URLSearchParams(window.location.search);
        const urlGas = urlParams.get('gas');

        function verificarFilaImpressao() {
            if (!urlGas) {
                console.error("Sentinela: URL do GAS não informada nos parâmetros.");
                return;
            }

            // Adiciona a ação de verificar impressão na URL base do GAS
            const endpoint = urlGas + (urlGas.includes('?') ? '&' : '?') + 'acao=verificarImpressao';

            fetch(endpoint, { 
                method: 'GET',
                mode: 'cors' // Garante requisição cross-origin
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Erro na rede: ' + response.status);
                }
                return response.json();
            })
            .then(data => {
                if (data && data.imprimir) {
                    console.log("Sentinela: Pedido pendente encontrado!", data.pedidoObj?.pedido);
                    
                    // Envia o comando de impressão e o objeto formatado para a janela principal (Wrapper)
                    window.parent.postMessage({
                        acao: "IMPRIMIR_PEDIDO",
                        pedidoObj: data.pedidoObj, // Alterado para enviar o objeto estruturado
                        config: data.config
                    }, "*");
                }
            })
            .catch(err => {
                console.warn("Sentinela: Erro ao consultar fila de impressão", err);
            });
        }

        // Executa a primeira vez e depois a cada 10 segundos
        if (urlGas) {
            setInterval(verificarFilaImpressao, 10000);
            verificarFilaImpressao(); // Executa logo ao abrir
        }
    </script>
</body>
</html>
